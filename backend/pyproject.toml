[project]
name = "audio-reference-studio"
version = "0.0.0"
description = "Local-first audio reference studio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "matplotlib>=3.11.2",
  "numpy>=2.5.4",
  "pydantic==2.14.1",
  "python-multipart==0.0.32",
  "scipy>=1.18.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
